
services:
  db:
    image: postgres:17
    container_name: desafiox-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: desafiox
      POSTGRES_USER: desafiox
      POSTGRES_PASSWORD: dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U desafiox -d desafiox"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
