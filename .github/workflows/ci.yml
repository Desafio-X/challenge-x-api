name: CI

on:
  push:
    branches: [main, developer]
  pull_request:
    branches: [main, developer]

env:
  DJANGO_SECRET_KEY: ci-insecure-secret-key
  DJANGO_DEBUG: "False"
  POSTGRES_DB: desafiox
  POSTGRES_USER: desafiox
  POSTGRES_PASSWORD: ci_password
  POSTGRES_HOST: localhost
  POSTGRES_PORT: "5432"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: desafiox
          POSTGRES_USER: desafiox
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U desafiox -d desafiox"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --locked
      - name: Display Python version
        run: uv run python -c "import sys; print(sys.version)"
      - name: Django system check
        run: uv run python manage.py check
      - name: Run tests
        run: uv run pytest

  sonar:
    runs-on: ubuntu-latest
    needs: test

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: desafiox
          POSTGRES_USER: desafiox
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U desafiox -d desafiox"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # o Sonar precisa do histórico completo
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: Testes com cobertura
        run: uv run pytest --cov=apps --cov=config --cov-report=xml
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
